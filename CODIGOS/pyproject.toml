[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-hub"
version = "0.1.0"
description = "QR Lab Hub - Sistema de registro y reporteria de residuos de laboratorio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "tzdata>=2024.1",
    "dash>=2.17.0",
    "plotly>=5.22.0",
    "pandas>=2.2.0",
    "reportlab>=4.2.0",
    "matplotlib>=3.9.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "aiosmtpd>=1.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.setuptools.package-data]
lab_hub = ["templates/*.html", "dashboard/assets/*.css"]

