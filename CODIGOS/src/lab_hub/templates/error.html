<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso no autorizado — QR Lab Hub</title>
  <style>
    :root {
      --bg: #0B1411;
      --card-bg: #14231D;
      --danger: #FF6B6B;
      --text: #F4F8F5;
      --text-muted: #BCCEC3;
      --border: #2B4237;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .icon {
      width: 64px;
      height: 64px;
      background: rgba(255, 107, 107, 0.2);
      color: var(--danger);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1.25rem;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">!</div>
    <h1>Acceso No Autorizado</h1>
    <p>{{ message or "El código QR es inexistente, ha sido revocado o no cuenta con autorización." }}</p>
  </div>
</body>
</html>
