<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Exitoso — QR Lab Hub</title>
  <style>
    :root {
      --bg: #0B1411;
      --card-bg: #14231D;
      --primary: #64D6A0;
      --text: #F4F8F5;
      --text-muted: #BCCEC3;
      --border: #2B4237;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .icon {
      width: 64px;
      height: 64px;
      background: rgba(100, 214, 160, 0.2);
      color: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1.25rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .detail {
      background: #1B2D26;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      text-align: left;
      font-size: 0.9rem;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }
    .detail-row:last-child {
      margin-bottom: 0;
    }
    .detail-label {
      color: var(--text-muted);
    }
    .detail-val {
      font-weight: 600;
      color: var(--text);
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: var(--primary);
      color: #07120D;
      text-decoration: none;
      padding: 0.85rem;
      border-radius: 8px;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#10003;</div>
    <h1>Registro Guardado</h1>
    <p>El residuo fue registrado correctamente en la base de datos.</p>

    <div class="detail">
      <div class="detail-row">
        <span class="detail-label">ID de Registro:</span>
        <span class="detail-val">{{ record.id }}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Peso registrado:</span>
        <span class="detail-val">{{ record.weight_g }} g</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Fecha / Hora:</span>
        <span class="detail-val">{{ recorded_at_local }}</span>
      </div>
    </div>

    <a href="/r/{{ token }}" class="btn">Registrar otro residuo</a>
  </div>
</body>
</html>
